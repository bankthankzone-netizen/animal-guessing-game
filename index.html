<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Guessing Game for Kids</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif, Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                        url('https://i.postimg.cc/50RbjKC2/safari-wild-animals-wall-mural-wallpapers-(4)-4112-p.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* หน้าจอวิดีโอเต็มจอทับทุกอย่าง */
        #fullscreen-video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #fullscreen-video-overlay iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.93);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
            position: relative;
        }
        h1 {
            color: #d35400;
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #ffeaa7;
        }
        .subtitle {
            color: #2d3436;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* สไตล์สำหรับหน้าแรก (Welcome Screen) */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }
        .name-input {
            width: 80%;
            max-width: 400px;
            padding: 15px 20px;
            font-size: 1.3rem;
            border: 3px solid #74b9ff;
            border-radius: 20px;
            text-align: center;
            outline: none;
            font-family: inherit;
            color: #2d3436;
            background: #f1f2f6;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .name-input:focus {
            border-color: #0984e3;
            background: white;
        }
        .start-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 1.4rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #20bf55;
            transition: 0.2s;
        }
        .start-btn:hover {
            background-color: #20bf55;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #1ca74c;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1ca74c;
        }

        /* ส่วนของเกม (ซ่อนไว้ก่อน) */
        #game-area {
            display: none;
        }

        .player-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff3cd;
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #856404;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .score-board {
            font-size: 1.2rem;
            color: #0984e3;
            margin-bottom: 20px;
            font-weight: bold;
            background: #e8f4fd;
            padding: 8px 18px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .question-wrapper {
            background: #f1f2f6;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }
        .question-box {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #2f3640;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .icon-btn {
            background: #dfe4ea;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            color: #2f3640;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #ced6e0;
        }
        .icon-btn:hover {
            background: #ced6e0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b2bec3;
        }
        .icon-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b2bec3;
        }
        .translation-box {
            font-size: 1.15rem;
            color: #d35400;
            background: #fef9e7;
            padding: 12px 15px;
            border-radius: 15px;
            margin-top: 10px;
            display: none;
            text-align: left;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        .translation-box p {
            margin: 5px 0;
        }
        .vocab-box {
            background: #e3fafc;
            border: 3px dashed #00b4d8;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #03045e;
            box-shadow: 0 4px 10px rgba(0,180,216,0.1);
        }
        .vocab-title {
            font-size: 1.3rem;
            color: #0077b6;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
        .vocab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .vocab-info {
            display: flex;
            flex-direction: column;
        }
        .vocab-word {
            font-weight: bold;
            color: #023e8a;
            font-size: 1.25rem;
        }
        .vocab-read {
            color: #e67e22;
            font-size: 1rem;
            font-style: italic;
        }
        .vocab-meaning {
            color: #2f3640;
            font-size: 1.1rem;
        }
        .speak-vocab-btn {
            background: #48dbfb;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            transition: 0.2s;
            box-shadow: 0 3px 0 #0abde3;
        }
        .speak-vocab-btn:hover {
            background: #0abde3;
            transform: translateY(-2px);
        }
        .choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .choice-btn {
            padding: 18px;
            font-size: 1.25rem;
            background-color: #74b9ff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #0984e3;
        }
        .choice-btn:hover:not(:disabled) {
            background-color: #0984e3;
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #074b83;
        }
        .choice-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #074b83;
        }
        .choice-btn.correct {
            background-color: #2ed573 !important;
            box-shadow: 0 5px 0 #20bf55 !important;
        }
        .choice-btn.wrong {
            background-color: #ff4757 !important;
            box-shadow: 0 5px 0 #cc2131 !important;
        }
        .next-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            background-color: #ffa502;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #e67e22;
            transition: 0.2s;
            margin-top: 15px;
        }
        .next-btn:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #d35400;
        }
        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d35400;
        }
        .home-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #ff4757;
            transition: 0.2s;
            margin-top: 15px;
        }
        .home-btn:hover {
            background-color: #ff4757;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #e84118;
        }
        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e84118;
        }
        #feedback {
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 35px;
            margin-top: 10px;
        }

        /* --- สไตล์สำหรับ Popup คะแนน --- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .popup-card {
            background: white;
            padding: 30px 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: scale(0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-overlay.show .popup-card {
            transform: scale(1);
        }
        .popup-card h2 {
            color: #2ed573;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .popup-card p {
            font-size: 1.3rem;
            color: #57606f;
            margin-bottom: 20px;
        }
        .popup-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #20bf55;
        }
        .popup-btn:hover {
            background-color: #20bf55;
        }
    </style>
</head>
<body>

    <!-- หน้าจอแสดงวิดีโอเต็มจอแบบไม่เห็นฉากหลัง -->
    <div id="fullscreen-video-overlay">
        <iframe id="game-video" allow="fullscreen;autoplay" allowfullscreen src=""></iframe>
    </div>

    <!-- Popup แจ้งคะแนนเมื่อตอบถูก -->
    <div class="popup-overlay" id="score-popup">
        <div class="popup-card">
            <h2 id="popup-title">🎉 ปิ้งป่อง! ถูกต้องนะคร้าบ</h2>
            <p id="popup-msg">คุณได้รับ +1 คะแนน!</p>
            <button class="popup-btn" onclick="closePopup()">เยี่ยมไปเลย! 🌟</button>
        </div>
    </div>

    <div class="container" id="game-card">
        <h1>🦁 Animal Guessing Game 🐶</h1>
        <div class="subtitle">Fun English Game for Grade 3-4 Kids</div>
        
        <!-- หน้าแรก: กรอกชื่อนักเรียน -->
        <div class="welcome-screen" id="welcome-screen">
            <p style="font-size: 1.2rem; color: #2d3436; margin: 0; font-weight: bold;">พิมพ์ชื่อ-นามสกุล หรือชื่อเล่นของคุณ:</p>
            <input type="text" id="player-name-input" class="name-input" placeholder="เช่น ด.ช. รักเรียน สุขใจ" autocomplete="off">
            <button class="start-btn" onclick="startVideo()">🚀 เริ่มเล่นเกม (Start!)</button>
        </div>

        <!-- พื้นที่เล่นเกม (ซ่อนไว้ก่อน) -->
        <div id="game-area">
            <div class="player-info-bar">
                <span>👤 ผู้เล่น: <span id="display-name">-</span></span>
                <button onclick="goToHome()" style="background: #ff4757; color: white; border: none; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">🏠 เปลี่ยนชื่อ / หน้าแรก</button>
            </div>

            <div class="score-board">
                Question: <span id="current-q">1</span>/30 | Score: <span id="score">0</span>
            </div>

            <div class="question-wrapper">
                <div class="question-box" id="clue-text">Loading clue...</div>
                
                <div class="action-bar">
                    <button class="icon-btn" onclick="speakClue()">🔊 Listen Clue</button>
                    <button class="icon-btn" onclick="toggleTranslation()">🌐 Translate Thai</button>
                </div>

                <div class="translation-box" id="translation-text">
                    <p id="trans-clue"><b>คำถาม:</b> -</p>
                    <p id="trans-choices"><b>ตัวเลือก:</b> -</p>
                </div>
            </div>

            <div class="vocab-box" id="vocab-box">
                <div class="vocab-title">📚 Vocabulary (คำศัพท์น่ารู้)</div>
                <div id="vocab-list-container"></div>
            </div>

            <div class="choices-container" id="choices-box"></div>

            <div id="feedback"></div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
            <button class="home-btn" id="home-btn" onclick="goToHome()">🏠 กลับมาหน้าแรก (Home)</button>
        </div>
    </div>

    <script>
        const questions = [
            { 
                clue: "I am big and gray. I have a long trunk and big ears. What am I?", 
                choices: ["Elephant", "Lion", "Giraffe", "Zebra"], 
                choiceThai: { "Elephant": "ช้าง", "Lion": "สิงโต", "Giraffe": "ยีราฟ", "Zebra": "ม้าลาย" },
                answer: "Elephant", 
                thai: "ฉันตัวใหญ่และสีเทา ฉันมีงวงยาวและหูใหญ่ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "trunk", read: "ทรักคฺ", meaning: "งวงช้าง" },
                    { word: "gray", read: "เกรย์", meaning: "สีเทา" }
                ] 
            },
            { 
                clue: "I am the king of the jungle. I have a big mane and I roar. What am I?", 
                choices: ["Tiger", "Lion", "Bear", "Monkey"], 
                choiceThai: { "Tiger": "เสือ", "Lion": "สิงโต", "Bear": "หมี", "Monkey": "ลิง" },
                answer: "Lion", 
                thai: "ฉันคือราชาแห่งป่า ฉันมีแผงคอใหญ่และคำราม ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "mane", read: "เมน", meaning: "แผงคอ" },
                    { word: "roar", read: "รอร์", meaning: "คำราม" }
                ] 
            },
            { 
                clue: "I am tall with a very long neck. I love to eat leaves from tall trees. What am I?", 
                choices: ["Horse", "Elephant", "Giraffe", "Cow"], 
                choiceThai: { "Horse": "ม้า", "Elephant": "ช้าง", "Giraffe": "ยีราฟ", "Cow": "วัว" },
                answer: "Giraffe", 
                thai: "ฉันตัวสูงและมีคอยาวมาก ฉันชอบกินใบไม้จากต้นไม้สูง ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "neck", read: "เน็ค", meaning: "คอ" },
                    { word: "leaves", read: "ลีฟวส์", meaning: "ใบไม้" }
                ] 
            },
            { 
                clue: "I am black and white. I look like a horse with stripes. What am I?", 
                choices: ["Zebra", "Cow", "Panda", "Tiger"], 
                choiceThai: { "Zebra": "ม้าลาย", "Cow": "วัว", "Panda": "แพนด้า", "Tiger": "เสือ" },
                answer: "Zebra", 
                thai: "ฉันมีสีดำและขาว ฉันดูเหมือนม้าที่มีลายทาง ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "stripes", read: "สไตรป์ส", meaning: "ลายทาง" },
                    { word: "black and white", read: "แบล็ค แอนด์ ไวท์", meaning: "สีดำและสีขาว" }
                ] 
            },
            { 
                clue: "I am green and I love to hop and jump near ponds. I say 'ribbit'. What am I?", 
                choices: ["Fish", "Frog", "Turtle", "Duck"], 
                choiceThai: { "Fish": "ปลา", "Frog": "กบ", "Turtle": "เต่า", "Duck": "เป็ด" },
                answer: "Frog", 
                thai: "ฉันตัวสีเขียวและชอบกระโดดใกล้สระน้ำ ฉันร้อง อบๆ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "hop", read: "ฮ็อพ", meaning: "กระโดด" },
                    { word: "pond", read: "พอนด์", meaning: "สระน้ำ" }
                ] 
            },
            { 
                clue: "I am man's best friend. I love to bark and play fetch. What am I?", 
                choices: ["Cat", "Dog", "Rabbit", "Fox"], 
                choiceThai: { "Cat": "แมว", "Dog": "สุนัข", "Rabbit": "กระต่าย", "Fox": "สุนัขจิ้งจอก" },
                answer: "Dog", 
                thai: "ฉันคือเพื่อนที่ดีที่สุดของมนุษย์ ฉันชอบเห่าและวิ่งเก็บของ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "bark", read: "บาร์ค", meaning: "เห่า" },
                    { word: "best friend", read: "เบสท์ เฟรนด์", meaning: "เพื่อนสนิท" }
                ] 
            },
            { 
                clue: "I am small, I love to catch mice, and I say 'meow'. What am I?", 
                choices: ["Dog", "Cat", "Mouse", "Hamster"], 
                choiceThai: { "Dog": "สุนัข", "Cat": "แมว", "Mouse": "หนู", "Hamster": "แฮมสเตอร์" },
                answer: "Cat", 
                thai: "ฉันตัวเล็ก ชอบจับหนู และร้องเหมียวๆ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "catch", read: "แคทชฺ", meaning: "จับ" },
                    { word: "mice", read: "ไมซฺ", meaning: "หนูหลายตัว" }
                ] 
            },
            { 
                clue: "I love to eat carrots and I have long ears. I hop around. What am I?", 
                choices: ["Rabbit", "Monkey", "Pig", "Sheep"], 
                choiceThai: { "Rabbit": "กระต่าย", "Monkey": "ลิง", "Pig": "หมู", "Sheep": "แกะ" },
                answer: "Rabbit", 
                thai: "ฉันชอบกินแครอทและมีหูยาว ฉันกระโดดไปมา ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "carrots", read: "แครอทสฺ", meaning: "แครอท" },
                    { word: "long ears", read: "ลอง อีร์ส", meaning: "หูยาว" }
                ] 
            },
            { 
                clue: "I give you milk. I am black and white and I say 'moo'. What am I?", 
                choices: ["Goat", "Horse", "Cow", "Sheep"], 
                choiceThai: { "Goat": "แพะ", "Horse": "ม้า", "Cow": "วัว", "Sheep": "แกะ" },
                answer: "Cow", 
                thai: "ฉันให้นมคุณ ฉันมีสีดำและขาว ร้องมอๆ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "milk", read: "มิลค์", meaning: "นม" },
                    { word: "moo", read: "มู", meaning: "เสียงร้องของวัว" }
                ] 
            },
            { 
                clue: "I live in the water, I have fins and gills, and I swim all day. What am I?", 
                choices: ["Fish", "Shark", "Whale", "Frog"], 
                choiceThai: { "Fish": "ปลา", "Shark": "ฉลาม", "Whale": "วาฬ", "Frog": "กบ" },
                answer: "Fish", 
                thai: "ฉันอาศัยอยู่ในน้ำ มีครีบและเหงือก และว่ายน้ำทั้งวัน ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "water", read: "วอเทอร์", meaning: "น้ำ" },
                    { word: "swim", read: "สวิม", meaning: "ว่ายน้ำ" }
                ] 
            },
            { 
                clue: "I have feathers, wings, and a beak. I can fly high in the sky. What am I?", 
                choices: ["Bird", "Bat", "Bee", "Frog"], 
                choiceThai: { "Bird": "นก", "Bat": "ค้างคาว", "Bee": "ผึ้ง", "Frog": "กบ" },

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (type === 'correct') {
                const now = audioCtx.currentTime;
                
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1046.50, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.25);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1567.98, now + 0.15);
                gain2.gain.setValueAtTime(0.2, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.5);

            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

            let nameVal = playerNameInput.value.trim();
            if (nameVal === "") {

                playerNameInput.focus();
                return;
            }
            playerName = nameVal;
            displayName.textContent = playerName;

            welcomeScreen.style.display = "none";
            gameCard.style.display = "none";
            fullscreenVideoOverlay.style.display = "flex";

            // สั่งเล่นวิดีโอแบบเต็มจอ

        function loadQuestion() {
            if (currentIndex < questions.length) {
                let q = questions[currentIndex];
                
                gameCard.style.opacity = "0.7";
                setTimeout(() => {
                    clueText.textContent = q.clue;
                    
                    transClue.innerHTML = `<b>คำถาม:</b> ${q.thai}`;
                    let choicesTextArr = q.choices.map(c => `${c} = ${q.choiceThai[c]}`);
                    transChoices.innerHTML = `<b>ตัวเลือก:</b> ${choicesTextArr.join(" | ")}`;
                    translationText.style.display = "none";
                    
                    vocabListContainer.innerHTML = "";
                    q.vocab.forEach(item => {
                        let itemDiv = document.createElement("div");
                        itemDiv.className = "vocab-item";
                        
                        itemDiv.innerHTML = `
                            <div class="vocab-info">
                                <span class="vocab-word">${item.word} <span class="vocab-read">(${item.read})</span></span>
                                <span class="vocab-meaning">= ${item.meaning}</span>
                            </div>
                            <button class="speak-vocab-btn" onclick="speakWord('${item.word}')">🔊 ฟัง</button>
                        `;
                        vocabListContainer.appendChild(itemDiv);
                    });

                    currentQDisplay.textContent = currentIndex + 1;
                    feedback.textContent = "";
                    nextBtn.style.display = "none";
                    homeBtn.style.display = "none";
                    choicesBox.innerHTML = "";

                    q.choices.forEach(choice => {
                        let btn = document.createElement("button");
                        btn.textContent = choice;
                        btn.className = "choice-btn";
                        btn.onclick = () => checkAnswer(choice, q.answer, btn);
                        choicesBox.appendChild(btn);
                    });
                    gameCard.style.opacity = "1";
                }, 200);

            } else {
                clueText.textContent = `🎉 เยี่ยมมาก ${playerName}! คุณเล่นจบเกมแล้วครับ!`;
                choicesBox.style.display = "none";
                document.getElementById("vocab-box").style.display = "none";
                document.querySelector('.action-bar').style.display = "none";
                translationText.style.display = "none";
                feedback.textContent = `คะแนนรวมของคุณคือ ${score} จาก ${questions.length} คะแนน! 🌟`;
                feedback.style.color = "#d35400";
                nextBtn.style.display = "none";
                homeBtn.style.display = "block";
            }
        }

        function checkAnswer(selected, correct, selectedBtn) {
            let buttons = choicesBox.getElementsByTagName("button");
            for (let b of buttons) {
                b.disabled = true;
                if (b.textContent === correct) {
                    b.classList.add("correct");
                }
            }

            if (selected === correct) {
                score++;
                scoreDisplay.textContent = score;
                feedback.textContent = "✅ Correct! Great job!";
                feedback.style.color = "#2ed573";
                
                playSound('correct');

                popupTitle.textContent = "🎉 ปิ้งป่อง! ถูกต้องครับ";
                popupMsg.textContent = `${playerName} ได้ 1 คะแนน! (สะสม: ${score})`;
                scorePopup.classList.add("show");

            } else {
                selectedBtn.classList.add("wrong");
                feedback.textContent = `❌ Oops! The correct answer was "${correct}".`;
                feedback.style.color = "#ff4757";
                playSound('wrong');
            }

            nextBtn.style.display = "block";
        }

        function closePopup() {
            scorePopup.classList.remove("show");
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function speakClue() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let q = questions[currentIndex];
                let utterance = new SpeechSynthesisUtterance(q.clue);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleTranslation() {
            if (translationText.style.display === "block") {
                translationText.style.display = "none";
            } else {
                translationText.style.display = "block";
            }
        }
    </script>
</body>
</html>
