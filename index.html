<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Guessing Game for Kids</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif, Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                        url('https://i.postimg.cc/50RbjKC2/safari-wild-animals-wall-mural-wallpapers-(4)-4112-p.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* หน้าจอวิดีโอเต็มจอทับทุกอย่างแบบไม่มีฉากหลัง */
        #fullscreen-video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #fullscreen-video-overlay iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* ปุ่มข้ามฉุกเฉิน มุมขวาบน */
        .skip-video-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .skip-video-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.93);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
            position: relative;
        }
        h1 {
            color: #d35400;
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #ffeaa7;
        }
        .subtitle {
            color: #2d3436;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* หน้าแรก (Welcome Screen) */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }
        .name-input {
            width: 80%;
            max-width: 400px;
            padding: 15px 20px;
            font-size: 1.3rem;
            border: 3px solid #74b9ff;
            border-radius: 20px;
            text-align: center;
            outline: none;
            font-family: inherit;
            color: #2d3436;
            background: #f1f2f6;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .name-input:focus {
            border-color: #0984e3;
            background: white;
        }
        .start-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 1.4rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #20bf55;
            transition: 0.2s;
        }
        .start-btn:hover {
            background-color: #20bf55;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #1ca74c;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1ca74c;
        }

        #game-area {
            display: none;
        }

        .player-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff3cd;
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #856404;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .score-board {
            font-size: 1.2rem;
            color: #0984e3;
            margin-bottom: 20px;
            font-weight: bold;
            background: #e8f4fd;
            padding: 8px 18px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .question-wrapper {
            background: #f1f2f6;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }
        .question-box {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #2f3640;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .icon-btn {
            background: #dfe4ea;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            color: #2f3640;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #ced6e0;
        }
        .icon-btn:hover {
            background: #ced6e0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b2bec3;
        }
        .icon-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b2bec3;
        }
        .translation-box {
            font-size: 1.15rem;
            color: #d35400;
            background: #fef9e7;
            padding: 12px 15px;
            border-radius: 15px;
            margin-top: 10px;
            display: none;
            text-align: left;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        .translation-box p {
            margin: 5px 0;
        }
        .vocab-box {
            background: #e3fafc;
            border: 3px dashed #00b4d8;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #03045e;
            box-shadow: 0 4px 10px rgba(0,180,216,0.1);
        }
        .vocab-title {
            font-size: 1.3rem;
            color: #0077b6;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
        .vocab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .vocab-info {
            display: flex;
            flex-direction: column;
        }
        .vocab-word {
            font-weight: bold;
            color: #023e8a;
            font-size: 1.25rem;
        }
        .vocab-read {
            color: #e67e22;
            font-size: 1rem;
            font-style: italic;
        }
        .vocab-meaning {
            color: #2f3640;
            font-size: 1.1rem;
        }
        .speak-vocab-btn {
            background: #48dbfb;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            transition: 0.2s;
            box-shadow: 0 3px 0 #0abde3;
        }
        .speak-vocab-btn:hover {
            background: #0abde3;
            transform: translateY(-2px);
        }
        .choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .choice-btn {
            padding: 18px;
            font-size: 1.25rem;
            background-color: #74b9ff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #0984e3;
        }
        .choice-btn.correct {
            background-color: #2ed573 !important;
            box-shadow: 0 5px 0 #20bf55 !important;
        }
        .choice-btn.wrong {
            background-color: #ff4757 !important;
            box-shadow: 0 5px 0 #cc2131 !important;
        }
        .next-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            background-color: #ffa502;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #e67e22;
            transition: 0.2s;
            margin-top: 15px;
        }
        .home-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #ff4757;
            transition: 0.2s;
            margin-top: 15px;
        }
        #feedback {
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 35px;
            margin-top: 10px;
        }

        /* Popup คะแนน */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .popup-card {
            background: white;
            padding: 30px 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: scale(0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-overlay.show .popup-card {
            transform: scale(1);
        }
        .popup-card h2 {
            color: #2ed573;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .popup-card p {
            font-size: 1.3rem;
            color: #57606f;
            margin-bottom: 20px;
        }
        .popup-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #20bf55;
        }
    </style>
</head>
<body>

    <!-- หน้าจอแสดงวิดีโอเต็มจอแบบไม่เห็นฉากหลัง พร้อมปุ่มข้ามฉุกเฉิน -->
    <div id="fullscreen-video-overlay">
        <button class="skip-video-btn" onclick="startActualGame()">▶ เริ่มเล่นเกมทันที</button>
        <iframe id="game-video" allow="fullscreen;autoplay" allowfullscreen src=""></iframe>
    </div>

    <!-- Popup แจ้งคะแนนเมื่อตอบถูก -->
    <div class="popup-overlay" id="score-popup">
        <div class="popup-card">
            <h2 id="popup-title">🎉 ปิ้งป่อง! ถูกต้องนะคร้าบ</h2>
            <p id="popup-msg">คุณได้รับ +1 คะแนน!</p>
            <button class="popup-btn" onclick="closePopup()">เยี่ยมไปเลย! 🌟</button>
        </div>
    </div>

    <div class="container" id="game-card">
        <h1>🦁 Animal Guessing Game 🐶</h1>
        <div class="subtitle">Fun English Game for Grade 3-4 Kids</div>
        
        <!-- หน้าแรก: กรอกชื่อนักเรียน -->
        <div class="welcome-screen" id="welcome-screen">
            <p style="font-size: 1.2rem; color: #2d3436; margin: 0; font-weight: bold;">พิมพ์ชื่อ-นามสกุล หรือชื่อเล่นของคุณ:</p>
            <input type="text" id="player-name-input" class="name-input" placeholder="เช่น ด.ช. รักเรียน สุขใจ" autocomplete="off">
            <button class="start-btn" onclick="startVideo()">🚀 เริ่มเล่นเกม (Start!)</button>
        </div>

        <!-- พื้นที่เล่นเกม -->
        <div id="game-area">
            <div class="player-info-bar">
                <span>👤 ผู้เล่น: <span id="display-name">-</span></span>
                <button onclick="goToHome()" style="background: #ff4757; color: white; border: none; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">🏠 เปลี่ยนชื่อ / หน้าแรก</button>
            </div>

            <div class="score-board">
                Question: <span id="current-q">1</span>/30 | Score: <span id="score">0</span>
            </div>

            <div class="question-wrapper">
                <div class="question-box" id="clue-text">Loading clue...</div>
                
                <div class="action-bar">
                    <button class="icon-btn" onclick="speakClue()">🔊 Listen Clue</button>
                    <button class="icon-btn" onclick="toggleTranslation()">🌐 Translate Thai</button>
                </div>

                <div class="translation-box" id="translation-text">
                    <p id="trans-clue"><b>คำถาม:</b> -</p>
                    <p id="trans-choices"><b>ตัวเลือก:</b> -</p>
                </div>
            </div>

            <div class="vocab-box" id="vocab-box">
                <div class="vocab-title">📚 Vocabulary (คำศัพท์น่ารู้)</div>
                <div id="vocab-list-container"></div>
            </div>

            <div class="choices-container" id="choices-box"></div>

            <div id="feedback"></div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
            <button class="home-btn" id="home-btn" onclick="goToHome()">🏠 กลับมาหน้าแรก (Home)</button>
        </div>
    </div>

    <script>
        const questions = [
            { 
                clue: "I am a massive gray animal known for my incredible strength and weight. What am I?", 
                choices: ["Elephant", "Lion", "Giraffe", "Zebra"], 
                choiceThai: { "Elephant": "ช้าง", "Lion": "สิงโต", "Giraffe": "ยีราฟ", "Zebra": "ม้าลาย" },
                answer: "Elephant", 
                thai: "ฉันคือสัตว์สีเทาขนาดมหึมาที่ขึ้นชื่อเรื่องพละกำลังและน้ำหนักตัวที่มาก ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "massive", read: "แมสซีฟ", meaning: "ใหญ่โตมโหฬาร" },
                    { word: "strength", read: "สเตร็งทธ์", meaning: "พละกำลัง" }
                ] 
            },
            { 
                clue: "I am a powerful predator ruling open grasslands with a commanding loud sound. What am I?", 
                choices: ["Tiger", "Lion", "Bear", "Monkey"], 
                choiceThai: { "Tiger": "เสือ", "Lion": "สิงโต", "Bear": "หมี", "Monkey": "ลิง" },
                answer: "Lion", 
                thai: "ฉันคือนักล่าผู้ทรงพลังที่ครองทุ่งหญ้ากว้างใหญ่ด้วยเสียงร้องคำรามก้อง ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "predator", read: "พรีเดเตอร์", meaning: "สัตว์นักล่า" },
                    { word: "commanding", read: "คอมแมนดิง", meaning: "ทรงอำนาจ / น่าเกรงขาม" }
                ] 
            },
            { 
                clue: "I am the tallest land animal, reaching high branches that others cannot touch. What am I?", 
                choices: ["Horse", "Elephant", "Giraffe", "Cow"], 
                choiceThai: { "Horse": "ม้า", "Elephant": "ช้าง", "Giraffe": "ยีราฟ", "Cow": "วัว" },
                answer: "Giraffe", 
                thai: "ฉันคือสัตว์บกที่สูงที่สุด เอื้อมถึงกิ่งไม้สูงๆ ที่ตัวอื่นเอื้อมไม่ถึง ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "tallest", read: "ทอลเลสท์", meaning: "สูงที่สุด" },
                    { word: "branches", read: "บรานช์ซิส", meaning: "กิ่งไม้" }
                ] 
            },
            { 
                clue: "I roam the wild with a unique black and white patterned coat. What am I?", 
                choices: ["Zebra", "Cow", "Panda", "Tiger"], 
                choiceThai: { "Zebra": "ม้าลาย", "Cow": "วัว", "Panda": "แพนด้า", "Tiger": "เสือ" },
                answer: "Zebra", 
                thai: "ฉันใช้ชีวิตในป่าพร้อมลวดลายขาวดำที่เป็นเอกลักษณ์ไม่เหมือนใคร ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "patterned", read: "แพทเทิร์นด", meaning: "มีลวดลาย" },
                    { word: "unique", read: "ยูนี้ค", meaning: "เป็นเอกลักษณ์" }
                ] 
            },
            { 
                clue: "I start my life as a swimmer in ponds, then grow up to leap on land. What am I?", 
                choices: ["Fish", "Frog", "Turtle", "Duck"], 
                choiceThai: { "Fish": "ปลา", "Frog": "กบ", "Turtle": "เต่า", "Duck": "เป็ด" },
                answer: "Frog", 
                thai: "ฉันเริ่มต้นชีวิตในสระน้ำด้วยการว่ายน้ำ ก่อนจะโตมาเป็นสัตว์ที่กระโดดได้บนบก ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "start", read: "สตาร์ท", meaning: "เริ่มต้น" },
                    { word: "leap", read: "ลีพ", meaning: "กระโดด" }
                ] 
            },
            { 
                clue: "I am a loyal household companion that protects homes and catches balls. What am I?", 
                choices: ["Cat", "Dog", "Rabbit", "Fox"], 
                choiceThai: { "Cat": "แมว", "Dog": "สุนัข", "Rabbit": "กระต่าย", "Fox": "สุนัขจิ้งจอก" },
                answer: "Dog", 
                thai: "ฉันคือเพื่อนคู่ใจในบ้านที่คอยเฝ้าบ้านและชอบวิ่งเก็บลูกบอล ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "loyal", read: "โลยัล", meaning: "ซื่อสัตย์" },
                    { word: "companion", read: "คอมพาเนียน", meaning: "เพื่อนร่วมทาง" }
                ] 
            },
            { 
                clue: "I am a nimble house pet known for being quiet and hunting small pests. What am I?", 
                choices: ["Dog", "Cat", "Mouse", "Hamster"], 
                choiceThai: { "Dog": "สุนัข", "Cat": "แมว", "Mouse": "หนู", "Hamster": "แฮมสเตอร์" },
                answer: "Cat", 
                thai: "ฉันคือสัตว์เลี้ยงตัวนิ่มที่ขึ้นชื่อเรื่องความเงียบเชียบและชอบล่าสัตว์ตัวเล็กๆ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "nimble", read: "นิมเบิล", meaning: "ว่องไว" },
                    { word: "pests", read: "เพสต์ส", meaning: "สัตว์รบกวน / สัตว์ตัวเล็ก" }
                ] 
            },
            { 
                clue: "I am a swift jumper with soft fur who adores crunchy root vegetables. What am I?", 
                choices: ["Rabbit", "Monkey", "Pig", "Sheep"], 
                choiceThai: { "Rabbit": "กระต่าย", "Monkey": "ลิง", "Pig": "หมู", "Sheep": "แกะ" },
                answer: "Rabbit", 
                thai: "ฉันคือนักกระโดดว่องไวที่มีขนฟูนุ่มและชื่นชอบพืชหัวกรุบกรอบ ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "swift", read: "สวิฟท์", meaning: "รวดเร็ว" },
                    { word: "crunchy", read: "ครันชี", meaning: "กรุบกรอบ" }
                ] 
            },
            { 
                clue: "I provide healthy drinks for humans and spend my day grazing on pasture grass. What am I?", 
                choices: ["Goat", "Horse", "Cow", "Sheep"], 
                choiceThai: { "Goat": "แพะ", "Horse": "ม้า", "Cow": "วัว", "Sheep": "แกะ" },
                answer: "Cow", 
                thai: "ฉันคือนักผลิตเครื่องดื่มมีประโยชน์ให้มนุษย์ และใช้เวลาทั้งวันเดินเล็มหญ้าในทุ่ง ฉันคือตัวอะไร?", 
                vocab: [
                    { word: "grazing", read: "เกรซิง", meaning: "เล็มหญ้า" },
                    { word: "pasture", read: "พาสเชอร์", meaning: "ทุ่งหญ้าเลี้ยงสัตว์" }
                ] 
            },
            { 
                clue: "I am a pure aquatic creature breathing underwater through specialized organs. What am I?", 
                choices: ["Fish", "Alligator", "Turtle", "Duck"],

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (type === 'correct') {
                const now = audioCtx.currentTime;
                
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1046.50, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.25);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1567.98, now + 0.15);
                gain2.gain.setValueAtTime(0.2, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.5);

            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

            gameCard.style.display = "none";
            fullscreenVideoOverlay.style.display = "flex";

            // สั่งเล่นวิดีโอ
            gameVideo.src = "https://streamable.com/e/vlks9f?autoplay=1&loop=0&nocontrols=1";

            // ปรับเวลาตั้งตัดเข้าเกมเป็น 9.8 วินาที (9800 มิลลิวินาที)
            if (videoTimer) clearTimeout(videoTimer);
            videoTimer = setTimeout(() => {
                startActualGame();
            }, 9800); 
        }

        function startActualGame() {
            if (isGameStarted) return;
            isGameStarted = true;

            if (videoTimer) clearTimeout(videoTimer);
            gameVideo.src = "";

            fullscreenVideoOverlay.style.display = "none";
            gameCard.style.display = "block";
            gameArea.style.display = "block";

            currentIndex = 0;
            score = 0;
            scoreDisplay.textContent = score;
            choicesBox.style.display = "grid";
            document.getElementById("vocab-box").style.display = "block";
            document.querySelector('.action-bar').style.display = "flex";
            
            loadQuestion();
        }

        function goToHome() {
            if (videoTimer) clearTimeout(videoTimer);
            gameVideo.src = "";
            fullscreenVideoOverlay.style.display = "none";
            gameArea.style.display = "none";
            gameCard.style.display = "block";
            welcomeScreen.style.display = "flex";
            playerNameInput.value = "";
            translationText.style.display = "none";
            scorePopup.classList.remove("show");
        }

        function loadQuestion() {
            if (currentIndex < questions.length) {
                let q = questions[currentIndex];
                
                gameCard.style.opacity = "0.7";
                setTimeout(() => {
                    clueText.textContent = q.clue;
                    
                    transClue.innerHTML = `<b>คำถาม:</b> ${q.thai}`;
                    let choicesTextArr = q.choices.map(c => `${c} = ${q.choiceThai[c]}`);
                    transChoices.innerHTML = `<b>ตัวเลือก:</b> ${choicesTextArr.join(" | ")}`;
                    translationText.style.display = "none";
                    
                    vocabListContainer.innerHTML = "";
                    q.vocab.forEach(item => {
                        let itemDiv = document.createElement("div");
                        itemDiv.className = "vocab-item";
                        
                        itemDiv.innerHTML = `
                            <div class="vocab-info">
                                <span class="vocab-word">${item.word} <span class="vocab-read">(${item.read})</span></span>
                                <span class="vocab-meaning">= ${item.meaning}</span>
                            </div>
                            <button class="speak-vocab-btn" onclick="speakWord('${item.word}')">🔊 ฟัง</button>
                        `;
                        vocabListContainer.appendChild(itemDiv);
                    });

                    currentQDisplay.textContent = currentIndex + 1;
                    feedback.textContent = "";
                    nextBtn.style.display = "none";
                    homeBtn.style.display = "none";
                    choicesBox.innerHTML = "";

                    q.choices.forEach(choice => {
                        let btn = document.createElement("button");
                        btn.textContent = choice;
                        btn.className = "choice-btn";
                        btn.onclick = () => checkAnswer(choice, q.answer, btn);
                        choicesBox.appendChild(btn);
                    });
                    gameCard.style.opacity = "1";
                }, 200);

            } else {
                clueText.textContent = `🎉 เยี่ยมมาก ${playerName}! คุณเล่นจบเกมแล้วครับ!`;
                choicesBox.style.display = "none";
                document.getElementById("vocab-box").style.display = "none";
                document.querySelector('.action-bar').style.display = "none";
                translationText.style.display = "none";
                feedback.textContent = `คะแนนรวมของคุณคือ ${score} จาก ${questions.length} คะแนน! 🌟`;
                feedback.style.color = "#d35400";
                nextBtn.style.display = "none";
                homeBtn.style.display = "block";
            }
        }

        function checkAnswer(selected, correct, selectedBtn) {
            let buttons = choicesBox.getElementsByTagName("button");
            for (let b of buttons) {
                b.disabled = true;
                if (b.textContent === correct) {
                    b.classList.add("correct");
                }
            }

            if (selected === correct) {
                score++;
                scoreDisplay.textContent = score;
                feedback.textContent = "✅ Correct! Great job!";
                feedback.style.color = "#2ed573";
                
                playSound('correct');

                popupTitle.textContent = "🎉 ปิ้งป่อง! ถูกต้องครับ";
                popupMsg.textContent = `${playerName} ได้ 1 คะแนน! (สะสม: ${score})`;
                scorePopup.classList.add("show");

            } else {
                selectedBtn.classList.add("wrong");
                feedback.textContent = `❌ Oops! The correct answer was "${correct}".`;
                feedback.style.color = "#ff4757";
                playSound('wrong');
            }

            nextBtn.style.display = "block";
        }

        function closePopup() {
            scorePopup.classList.remove("show");
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        function speakClue() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let q = questions[currentIndex];
                let utterance = new SpeechSynthesisUtterance(q.clue);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleTranslation() {
            if (translationText.style.display === "block") {
                translationText.style.display = "none";
            } else {
                translationText.style.display = "block";
            }
        }
    </script>
</body>
</html>
