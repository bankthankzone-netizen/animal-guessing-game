<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Guessing Game for Kids</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif, Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }
        .score-board {
            font-size: 1.2rem;
            color: #0984e3;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-box {
            font-size: 1.2rem;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #2f3640;
        }
        .choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .choice-btn {
            padding: 15px;
            font-size: 1.1rem;
            background-color: #74b9ff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .choice-btn:hover {
            background-color: #0984e3;
            transform: scale(1.03);
        }
        #feedback {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🦁 Animal Guessing Game 🐶</h1>
        <p>Read the clue and choose the correct animal!</p>
        
        <div class="score-board">
            Question: <span id="current-q">1</span>/30 | Score: <span id="score">0</span>
        </div>

        <div class="question-box" id="clue-text">
            Loading clue...
        </div>

        <div class="choices-container" id="choices-box">
            <!-- ปุ่มช้อยส์จะถูกสร้างด้วย JavaScript -->
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        const questions = [
            { clue: "I am big and gray. I have a long trunk and big ears. What am I?", choices: ["Elephant", "Lion", "Giraffe", "Zebra"], answer: "Elephant" },
            { clue: "I am the king of the jungle. I have a big mane and I roar. What am I?", choices: ["Tiger", "Lion", "Bear", "Monkey"], answer: "Lion" },
            { clue: "I am tall with a very long neck. I love to eat leaves from tall trees. What am I?", choices: ["Horse", "Elephant", "Giraffe", "Cow"], answer: "Giraffe" },
            { clue: "I am black and white. I look like a horse with stripes. What am I?", choices: ["Zebra", "Cow", "Panda", "Tiger"], answer: "Zebra" },
            { clue: "I am green and I love to hop and jump near ponds. I say 'ribbit'. What am I?", choices: ["Fish", "Frog", "Turtle", "Duck"], answer: "Frog" },
            { clue: "I am man's best friend. I love to bark and play fetch. What am I?", choices: ["Cat", "Dog", "Rabbit", "Fox"], answer: "Dog" },
            { clue: "I am small, I love to catch mice, and I say 'meow'. What am I?", choices: ["Dog", "Cat", "Mouse", "Hamster"], answer: "Cat" },
            { clue: "I love to eat carrots and I have long ears. I hop around. What am I?", choices: ["Rabbit", "Monkey", "Pig", "Sheep"], answer: "Rabbit" },
            { clue: "I give you milk. I am black and white and I say 'moo'. What am I?", choices: ["Goat", "Horse", "Cow", "Sheep"], answer: "Cow" },
            { clue: "I live in the water, I have fins and gills, and I swim all day. What am I?", choices: ["Fish", "Shark", "Whale", "Frog"], answer: "Fish" },
            { clue: "I have feathers, wings, and a beak. I can fly high in the sky. What am I?", choices: ["Bird", "Bat", "Bee", "Frog"], answer: "Bird" },
            { clue: "I am very slow and I carry a heavy shell on my back. What am I?", choices: ["Snail", "Turtle", "Crab", "Frog"], answer: "Turtle" },
            { clue: "I am pink and fat. I love to roll in the mud. What am I?", choices: ["Pig", "Sheep", "Hippo", "Cow"], answer: "Pig" },
            { clue: "I am very smart. I live in the ocean and I love to jump and play. What am I?", choices: ["Shark", "Dolphin", "Fish", "Octopus"], answer: "Dolphin" },
            { clue: "I have eight arms and I live deep in the sea. What am I?", choices: ["Crab", "Octopus", "Starfish", "Jellyfish"], answer: "Octopus" },
            { clue: "I am black and white, I live in the snow, and I cannot fly. What am I?", choices: ["Polar Bear", "Penguin", "Seal", "Zebra"], answer: "Penguin" },
            { clue: "I have black and orange stripes. I am a big wild cat. What am I?", choices: ["Lion", "Tiger", "Leopard", "Cheetah"], answer: "Tiger" },
            { clue: "I am brown, I love honey, and I sleep all winter. What am I?", choices: ["Wolf", "Bear", "Fox", "Lion"], answer: "Bear" },
            { clue: "I am a pink bird with long legs that loves to stand in water. What am I?", choices: ["Flamingo", "Duck", "Swan", "Ostrich"], answer: "Flamingo" },
            { clue: "I am a small insect that makes honey and buzzes around flowers. What am I?", choices: ["Ant", "Bee", "Wasp", "Fly"], answer: "Bee" },
            { clue: "I am green and I have a hard shell. I snap with my big mouth and live in rivers. What am I?", choices: ["Alligator", "Crocodile", "Turtle", "Frog"], answer: "Crocodile" },
            { clue: "I am a jumping animal from Australia and carry my baby in a pouch. What am I?", choices: ["Kangaroo", "Koala", "Rabbit", "Deer"], answer: "Kangaroo" },
            { clue: "I am small and gray. I love to eat cheese and run away from cats. What am I?", choices: ["Mouse", "Hamster", "Rabbit", "Squirrel"], answer: "Mouse" },
            { clue: "I have a long tail and love to climb trees and eat bananas. What am I?", choices: ["Monkey", "Cat", "Squirrel", "Sloth"], answer: "Monkey" },
            { clue: "I am a bird that cannot fly, but I can run super fast across the desert. What am I?", choices: ["Penguin", "Ostrich", "Duck", "Chicken"], answer: "Ostrich" },
            { clue: "I have black and yellow stripes and I sting when I'm mad (not a bee). What am I?", choices: ["Wasp", "Fly", "Ant", "Mosquito"], answer: "Wasp" },
            { clue: "I live in the ocean and have sharp teeth. People call me a scary swimmer. What am I?", choices: ["Whale", "Shark", "Dolphin", "Seal"], answer: "Shark" },
            { clue: "I have long ears and a soft coat. I am smaller than a horse and carry heavy things. What am I?", choices: ["Donkey", "Horse", "Goat", "Sheep"], answer: "Donkey" },
            { clue: "I am green, scaly, and I can change my skin color to hide. What am I?", choices: ["Snake", "Chameleon", "Frog", "Lizard"], answer: "Chameleon" },
            { clue: "I am a big farm animal with hooves. People love to ride me. What am I?", choices: ["Cow", "Horse", "Donkey", "Pig"], answer: "Horse" }
        ];

        let currentIndex = 0;
        let score = 0;

        const clueText = document.getElementById("clue-text");
        const choicesBox = document.getElementById("choices-box");
        const scoreDisplay = document.getElementById("score");
        const currentQDisplay = document.getElementById("current-q");
        const feedback = document.getElementById("feedback");

        function loadQuestion() {
            if (currentIndex < questions.length) {
                let q = questions[currentIndex];
                clueText.textContent = q.clue;
                currentQDisplay.textContent = currentIndex + 1;
                feedback.textContent = "";
                choicesBox.innerHTML = "";

                // สร้างปุ่มตัวเลือก 4 ช้อยส์
                q.choices.forEach(choice => {
                    let btn = document.createElement("button");
                    btn.textContent = choice;
                    btn.className = "choice-btn";
                    btn.onclick = () => checkAnswer(choice, q.answer);
                    choicesBox.appendChild(btn);
                });
            } else {
                clueText.textContent = "🎉 Congratulations! You finished the game!";
                choicesBox.style.display = "none";
                feedback.textContent = `Your final score is ${score} out of ${questions.length}!`;
                feedback.style.color = "#ff6b6b";
            }
        }

        function checkAnswer(selected, correct) {
            // ปิดปุ่มทั้งหมดหลังคลิกเพื่อกันกดซ้ำ
            let buttons = choicesBox.getElementsByTagName("button");
            for (let b of buttons) {
                b.disabled = true;
            }

            if (selected === correct) {
                score++;
                scoreDisplay.textContent = score;
                feedback.textContent = "✅ Correct! Great job!";
                feedback.style.color = "#2ed573";
            } else {
                feedback.textContent = `❌ Oops! The correct answer was "${correct}".`;
                feedback.style.color = "#ff4757";
            }

            currentIndex++;
            setTimeout(loadQuestion, 1500); // รอ 1.5 วินาทีแล้วไปข้อถัดไป
        }

        // เริ่มต้นโหลดข้อแรก
        loadQuestion();
    </script>
</body>
</html>
